<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>쇼츠 4문제형</title>
<link rel="stylesheet" href="pkg-fontsource-jua/index.css">
<link rel="stylesheet" href="pkg-fontsource-noto-sans-kr/500.css">
<link rel="stylesheet" href="pkg-fontsource-noto-sans-kr/700.css">
<link rel="stylesheet" href="pkg-fontsource-noto-sans-kr/900.css">
<style>
/* 1080×1920 쇼츠, 4문제: 1~3번은 타이머 뒤 정답·해설 공개, 마지막 문제는 "정답은 댓글에서". setTime(t)로 그 순간을 그린다. */
:root { --green: #14806f; --green-dk: #0d5b4f; --green-soft: #e0f3ee; --gold: #f4b324; --gold-soft: #fff4d8; --gold-ink: #7a5300; --red: #c8232c; --red-soft: #fde8e8; --ink: #15191c; --muted: #5d6670; --line: #e2e7e6; --sunk: #f1f4f3 }
* { box-sizing: border-box; margin: 0 }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff }
body { font-family: "Noto Sans KR", sans-serif; color: var(--ink); position: relative }
.disp { font-family: "Jua", sans-serif; font-weight: 400 }
.layer { position: absolute; inset: 0 }

.head { position: absolute; left: 90px; right: 90px; top: 150px; display: flex; align-items: center; gap: 22px }
.head svg { width: 92px; height: 92px; flex: none }
.series { font-size: 58px; color: var(--green); line-height: 1 }
.dots { margin-left: auto; display: flex; gap: 12px }
.dots i { width: 26px; height: 26px; border-radius: 50%; background: var(--sunk); display: block }
.dots i.done { background: var(--green) } .dots i.now { background: var(--gold) }
.badge { position: absolute; left: 90px; top: 280px; display: inline-flex; align-items: center; gap: 14px; padding: 14px 26px; border-radius: 999px; background: var(--gold-soft); color: var(--gold-ink); font-weight: 900; font-size: 38px }
.badge i { width: 16px; height: 16px; border-radius: 50%; background: var(--gold); display: block }
.subj { position: absolute; left: 90px; top: 372px; font-size: 36px; font-weight: 700; color: var(--muted) }

.card { position: absolute; left: 90px; right: 90px; top: 450px; height: 470px; border-radius: 48px; background: var(--green); color: #fff; display: grid; place-items: center; padding: 40px 60px; text-align: center }
.card p { font-size: 88px; line-height: 1.22; word-break: keep-all }
.qn { position: absolute; left: 44px; top: 32px; font-size: 44px; color: #c6efe6 }

.timer { position: absolute; left: 50%; top: 975px; width: 250px; height: 250px; margin-left: -125px }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.timer circle { fill: none; stroke-width: 22 }
.timer .bg { stroke: var(--sunk) }
.timer .fg { stroke: var(--green); stroke-linecap: round }
.timer .n { position: absolute; inset: 0; display: grid; place-items: center; font-size: 128px; line-height: 1 }
.ask { position: absolute; left: 0; right: 0; top: 1250px; text-align: center; font-size: 46px; font-weight: 900 }

.ox { position: absolute; left: 130px; top: 1330px; display: flex; gap: 40px }
.ox div { width: 390px; height: 230px; border-radius: 40px; border: 6px solid var(--line); background: #fff; display: grid; place-items: center; font-size: 190px; line-height: 1; position: relative }
.ox .o { color: var(--green) } .ox .x { color: var(--red) }
.ox .o.win { background: var(--green); border-color: var(--green); color: #fff }
.ox .x.win { background: var(--red); border-color: var(--red); color: #fff }
.ox .lose { opacity: .25 }

/* 정답 공개 */
.ans { position: absolute; left: 90px; right: 90px; top: 975px; height: 330px; border-radius: 40px; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 56px }
.ans.o { background: var(--green-soft) } .ans.x { background: var(--red-soft) }
.ans b { font-size: 84px; line-height: 1 } .ans.o b { color: var(--green-dk) } .ans.x b { color: #9b1b22 }
.ans span { font-size: 44px; font-weight: 700; line-height: 1.4; word-break: keep-all }

/* 마지막 문제 */
.cta { position: absolute; left: 90px; right: 90px; top: 975px; height: 330px; border-radius: 40px; background: var(--gold-soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center }
.cta b { font-size: 92px; line-height: 1.1 }
.cta span { font-size: 42px; font-weight: 700; color: var(--gold-ink) }
.arrow { position: absolute; right: 70px; top: 1560px; width: 150px; height: 150px }
.arrow path { fill: none; stroke: var(--gold); stroke-width: 16; stroke-linecap: round; stroke-linejoin: round }

.end { background: var(--green); color: #fff; display: flex; flex-direction: column; align-items: center; padding-top: 360px; text-align: center }
.logo { width: 260px; height: 260px; border-radius: 64px; overflow: hidden }
.logo svg { width: 100%; height: 100%; display: block }
.end h1 { font-size: 130px; margin-top: 56px; line-height: 1 }
.end .l1 { font-size: 50px; font-weight: 900; margin-top: 64px }
.end .l2 { font-size: 50px; font-weight: 900; margin-top: 14px; color: #ffe3a1 }
.end .pill { margin-top: 84px; padding: 26px 56px; border-radius: 999px; background: #fff; color: var(--green-dk); font-size: 48px; font-weight: 900 }
.end .fine { position: absolute; bottom: 420px; left: 0; right: 0; font-size: 28px; font-weight: 500; color: #c6efe6 }
</style></head><body>
<div class="layer" id="q">
  <div class="head"><svg viewBox="0 0 62 62" aria-hidden="true"><ellipse cx="31" cy="36" rx="26" ry="23" fill="#14806f"/><rect x="9" y="17" width="44" height="7" rx="3" fill="#f4b324"/><circle cx="23" cy="35" r="3.4" fill="#0b2420"/><circle cx="39" cy="35" r="3.4" fill="#0b2420"/><path d="M25 44 Q31 49 37 44" stroke="#0b2420" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
    <div class="series disp">국시 S급 O/X</div><div class="dots" id="dots"></div></div>
  <div class="badge"><i></i><span id="badge"></span></div>
  <div class="subj" id="subj"></div>
  <div class="card" id="card"><span class="qn disp" id="qn"></span><p class="disp" id="question"></p></div>
  <div class="timer" id="timer"><svg viewBox="0 0 250 250"><circle class="bg" cx="125" cy="125" r="108"/><circle class="fg" id="ring" cx="125" cy="125" r="108"/></svg><div class="n disp" id="num"></div></div>
  <div class="ask" id="ask">O일까요? X일까요?</div>
  <div class="ox" id="ox"><div class="o disp" id="bo">O</div><div class="x disp" id="bx">X</div></div>
  <div class="ans" id="ans"><b class="disp" id="ansH"></b><span id="ansT"></span></div>
  <div class="cta" id="cta"><b class="disp">정답은 댓글에서!</b><span>마지막 문제, 먼저 댓글로 답해 보세요</span></div>
  <svg class="arrow" id="arrow" viewBox="0 0 150 150" aria-hidden="true"><path d="M20 20 C 70 30, 110 60, 120 120"/><path d="M88 108 L120 124 L134 90"/></svg>
</div>
<div class="layer end" id="end">
  <div class="logo"><svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" fill="#0d5b4f"/><rect x="120" y="330" width="90" height="70" rx="11" fill="#fff"/><rect x="210" y="260" width="90" height="140" rx="11" fill="#fff"/><rect x="300" y="190" width="91" height="210" rx="11" fill="#f4b324"/><path d="M345 95 280 165h130z" fill="#f4b324"/></svg></div>
  <h1 class="disp">물치 레벨업</h1>
  <div class="l1">물리치료사 국시 S급 개념 39개</div>
  <div class="l2">4,600개 이상의 키워드 문제를 게임처럼</div>
  <div class="pill">프로필 링크에서 무료로</div>
  <div class="fine">자체 제작 학습 콘텐츠 · 한국보건의료인국가시험원과 무관</div>
</div>
<script>
// 문제와 해설은 앱 데이터(S급 개념의 O/X 문항)에서 가져왔다. 마지막 문제의 정답은 영상에 넣지 않는다.
const SETS = {
  A: [
    { badge: "46~53회 8회 연속 출제", subj: "물리치료 기초 · 소화관과 소화샘", q: "쓸개즙은<br>쓸개에서<br>만들어진다.", a: false, why: "간에서 만들고, 쓸개는<br>저장·농축만 해요" },
    { badge: "46~53회 8회 연속 출제", subj: "물리치료 기초 · 다리 근육", q: "큰볼기근은<br>위볼기신경이<br>지배한다.", a: false, why: "큰볼기근은 아래볼기신경<br>위볼기신경은 중간·작은볼기근" },
    { badge: "47~53회 중 6회 출제", subj: "물리치료 진단평가 · 신경계 기능 척도", q: "버그균형척도는<br>56점 만점이다.", a: true, why: "14항목 × 4점 = 56점<br>높을수록 균형이 좋아요" },
    { badge: "47~53회 중 6회 출제", subj: "의료관계법규 · 의료인 면허·의무", q: "물리치료사는<br>의료법상<br>의료인이다.", a: null },
  ],
};
const QS = SETS[new URLSearchParams(location.search).get("set") || "A"];
// 타이밍(초): 문제마다 읽기 1.5 → 타이머 5 → 공개 3 (마지막은 공개 대신 댓글 유도 3), 끝에 마무리 3
const READ = 1.5, SECS = 5, SHOW = 3, END = 3;
const SEG = READ + SECS + SHOW;
const LEN = SEG * QS.length + END;
const $ = (id) => document.getElementById(id);
const clamp = (x) => Math.max(0, Math.min(1, x));
const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
const R = 2 * Math.PI * 108; $("ring").style.strokeDasharray = R;
const fx = (id, o, y = 0, s = 1, x = 0) => { const e = $(id); e.style.opacity = o; e.style.transform = `translate(${x}px, ${y}px) scale(${s})`; };
let shown = -1;
function load(i) {
  const d = QS[i]; shown = i;
  $("badge").textContent = d.badge; $("subj").textContent = d.subj; $("question").innerHTML = d.q; $("qn").textContent = `Q${i + 1}`;
  $("dots").innerHTML = QS.map((_, k) => `<i class="${k < i ? "done" : k === i ? "now" : ""}"></i>`).join("");
  if (d.a !== null) { $("ans").className = "ans " + (d.a ? "o" : "x"); $("ansH").textContent = `정답 ${d.a ? "O" : "X"}`; $("ansT").innerHTML = d.why; }
}
window.setTime = (t) => {
  const endIn = clamp((t - SEG * QS.length) / 0.4);
  $("end").style.opacity = endIn;
  const i = Math.min(QS.length - 1, Math.floor(t / SEG)); if (i !== shown) load(i);
  const d = QS[i]; const u = t - i * SEG; const last = d.a === null;
  // 문제가 바뀔 때 오른쪽에서 밀려 들어온다
  const inA = out(u / 0.35);
  ["card", "badge", "subj"].forEach((id) => fx(id, inA, 0, 1, (1 - inA) * 140));
  const left = Math.max(0, SECS - Math.max(0, u - READ)); const n = Math.ceil(left - 1e-6);
  const urgent = u >= READ && left <= 3 && left > 0;
  $("ring").style.strokeDashoffset = R * (1 - left / SECS);
  $("ring").style.stroke = urgent ? "var(--gold)" : "var(--green)";
  $("num").textContent = n; $("num").style.color = urgent ? "#b07b08" : "var(--ink)";
  const frac = (u - READ) % 1; const pulse = urgent ? 1 + 0.07 * Math.max(0, 1 - frac / 0.25) : 1;
  const rev = out((u - READ - SECS) / 0.3);
  fx("timer", inA * (1 - rev), 0, pulse); fx("ask", inA * (1 - rev));
  fx("ans", last ? 0 : rev, (1 - rev) * 40);
  fx("cta", last ? rev : 0, (1 - rev) * 40);
  const bob = last && rev > 0 ? Math.sin((u - READ - SECS) * Math.PI * 2 / 0.9) * 10 : 0;
  fx("arrow", last ? rev : 0, bob);
  // O/X: 공개되면 정답 칸이 채워지고 다른 칸은 흐려진다. 마지막 문제는 둘 다 흐려진다.
  const on = rev > 0.5;
  $("bo").className = "o disp" + (on && !last ? (d.a ? " win" : " lose") : "");
  $("bx").className = "x disp" + (on && !last ? (!d.a ? " win" : " lose") : "");
  fx("ox", inA * (last ? 1 - 0.7 * rev : 1), 0, 1, (1 - inA) * 140);
};
window.LEN = LEN;
window.CUES = { ticks: QS.flatMap((_, i) => Array.from({ length: SECS }, (_, k) => ({ t: i * SEG + READ + k, urgent: k >= SECS - 3 }))),
  reveal: QS.map((d, i) => ({ t: i * SEG + READ + SECS, last: d.a === null })) };
setTime(0);
</script>
</body></html>
